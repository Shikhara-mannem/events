<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engagement Invitation | Sri Mitra & Sai Kumar</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Peacock & Wedding Palette */
            --peacock-green: #06402B;
            --peacock-blue: #005f6b;
            --marigold-orange: #FF8C00;
            --deep-pink: #D81B60;
            --gold: #D4AF37;
            --off-white: #fdfaf1;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Orange and Pink backdrop as requested */
            background: linear-gradient(135deg, var(--marigold-orange), var(--deep-pink));
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            perspective: 1000px;
        }

        /* Classy Dark Green Card */
        .invitation-card {
            background: var(--peacock-green);
            border: 3px solid var(--gold);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        /* Peacock Motif Decoration */
        .invitation-card::before {
            content: "🦚";
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 28px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--gold);
            display: inline-block;
            padding-bottom: 5px;
        }

        .event-title {
            color: var(--off-white);
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-style: italic;
            margin: 15px 0;
        }

        .names {
            color: var(--gold);
            font-size: 26px;
            font-weight: 600;
            margin: 10px 0;
            letter-spacing: 1px;
        }

        .details {
            color: #e0e0e0;
            font-size: 15px;
            line-height: 1.8;
            margin: 20px 0;
            border-top: 1px dashed rgba(212, 175, 55, 0.3);
            border-bottom: 1px dashed rgba(212, 175, 55, 0.3);
            padding: 15px 0;
        }

        .highlight {
            color: var(--gold);
            font-weight: 500;
        }

        /* Placeholders for Link and Location */
        .location-section {
            margin-top: 20px;
            font-size: 14px;
            color: var(--off-white);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            background: var(--gold);
            color: var(--peacock-green);
            padding: 12px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, background 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.03);
            background: #f1d592;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
        }

        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="invitation-card">
            <h1>Save the Date</h1>
            
            <div class="event-title">For the Engagement of</div>
            
            <div class="names">
                Sri Mitra <br> & <br> Sai Kumar
            </div>

            <div class="details">
                📅 <span class="highlight">[INSERT DATE HERE]</span><br>
                🕒 <span class="highlight">[INSERT TIME HERE]</span><br>
                <div class="location-section">
                    📍 <strong>Location:</strong><br>
                    [ENTER VENUE NAME & ADDRESS HERE]
                </div>
            </div>

            <div class="btn-group">
                <a href="[INSERT_GOOGLE_MAPS_LINK_HERE]" target="_blank" class="btn">View on Google Maps</a>
                
                <a href="https://wa.me/[INSERT_PHONE_NUMBER]" class="btn btn-secondary">WhatsApp RSVP</a>
            </div>

            <div class="footer">
                TOGETHER WITH THEIR FAMILIES
            </div>
        </div>
    </div>

</body>
</html>
